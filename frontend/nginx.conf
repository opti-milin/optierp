server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tally exports are the largest thing this API accepts: the backend
        # allows 64 MB of base64 (~48 MB of XML), and Tally writes UTF-16, so
        # even a modest masters export is several MB once encoded. nginx
        # defaults to 1 MB and would reject those with a bare 413 long before
        # the backend could answer with something useful — leave headroom so
        # the API's own limit is the one users actually hit.
        client_max_body_size 72m;

        # Parsing a large export into staging rows happens inside the upload
        # request, which can outrun the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build artefacts are immutable — their name changes when they do, so
    # they can be cached hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one file that must never be cached: it is what points at
    # the hashed bundles above. A browser holding a stale copy keeps loading the
    # *previous* release's chunks, so a rebuild appears to change nothing and the
    # bug you just fixed is still there. That is not hypothetical — it is what
    # made a corrected route look broken until a hard refresh.
    # `always` so the header survives 304s too. Deliberately not `expires -1`,
    # which appends a second, weaker Cache-Control of its own.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}

# Local development stack: PostgreSQL + Redis + backend + frontend (Section 9, rule 11)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Dev mail catcher: backend SMTP points here; view sent mail at http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI

  backend:
    build: ./backend
    environment:
      SECRET_KEY: "local-dev-secret-key-change-in-production-0001"
      DATABASE_URL: "postgresql+asyncpg://erp_app:milin@postgres:5432/erp"
      MIGRATIONS_DATABASE_URL: "postgresql+asyncpg://erp_owner:milin@postgres:5432/erp"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      REFRESH_COOKIE_SECURE: "false"
      ENVIRONMENT: "development"
      # Email → Mailhog (dev). Swap for a real provider (SES/SendGrid) in prod.
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: "no-reply@optireach.local"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeMe!123}"
      # Showcase demo data. On by default so a clone on a new machine comes up
      # populated with no extra commands; set SEED_DEMO=false for a bare install
      # (bootstrap masters + admin only). The seeder is idempotent, so leaving it
      # on costs a few seconds per start once the data exists.
      SEED_DEMO: "${SEED_DEMO:-true}"
      DEMO_EMAIL: "${DEMO_EMAIL:-demo@optireach.in}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-Demo@12345}"
      # OCR (Data Entry). Set OCR_API_KEY in a repo-root .env or the shell.
      # OpenAI-compatible vision (gpt-4o-mini by default). Empty key → Extract stays disabled.
      OCR_PROVIDER: "${OCR_PROVIDER:-openai}"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_API_BASE: "${OCR_API_BASE:-https://api.openai.com/v1}"
      OCR_MODEL: "${OCR_MODEL:-gpt-4o-mini}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    # SEED_DEMO=true runs the showcase seeder, which already includes the
    # bootstrap (masters + admin) and statutory packs as its first two steps and
    # skips whatever is already seeded. Otherwise fall back to bootstrap only.
    # Never use seed_demo --reset-schema here: it drops schema public on every start.
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$SEED_DEMO\" = \"true\" ]; then
               python -m scripts.seed_showcase;
             else
               python -m scripts.load_statutory &&
               python -m scripts.seed --admin-email \"$$ADMIN_EMAIL\" --admin-password \"$$ADMIN_PASSWORD\";
             fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
